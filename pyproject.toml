[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "riffgen"
dynamic = ["version"]
description = "Generate role-labelled riff ideas (pitch sequences) from a chord-progression MIDI file"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Latif" }]
keywords = ["midi", "music", "riff", "chords", "generator", "producer"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Sound/Audio :: MIDI",
]
dependencies = ["mido>=1.3"]

[project.scripts]
riffgen = "riffgen.cli:main"
riffgen-gui = "riffgen.gui:main"

[tool.setuptools]
packages = ["riffgen"]

[tool.setuptools.dynamic]
version = { attr = "riffgen.__version__" }

[tool.setuptools.package-data]
riffgen = ["index.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
